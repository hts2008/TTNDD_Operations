steps:
  # Build web image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ttndd-web:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ttndd-web:latest'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=https://ttndd-api-HASH-as.a.run.app'
      - '-f'
      - 'apps/web/Dockerfile'
      - '.'
    id: docker-web

  # Push
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/ttndd-web:$COMMIT_SHA'
    id: push-web
    waitFor: ['docker-web']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ttndd-web'
      - '--image=gcr.io/$PROJECT_ID/ttndd-web:$COMMIT_SHA'
      - '--region=asia-southeast1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3000'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=5'
    id: deploy-web
    waitFor: ['push-web']

images:
  - 'gcr.io/$PROJECT_ID/ttndd-web:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/ttndd-web:latest'

timeout: '600s'

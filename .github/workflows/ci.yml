name: CI Pipeline
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm --filter @ttndd/constants build && pnpm --filter @ttndd/shared build
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: cd apps/api && npx prisma generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          DATABASE_MIGRATION_URL: postgresql://dummy:dummy@localhost:5432/dummy
      - run: pnpm build

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ttndd_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm --filter @ttndd/constants build && pnpm --filter @ttndd/shared build
      - name: Generate Prisma Client
        run: cd apps/api && npx prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/ttndd_test
          DATABASE_MIGRATION_URL: postgresql://test:test@localhost:5432/ttndd_test
      - name: Run database migrations
        run: cd apps/api && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/ttndd_test
          DATABASE_MIGRATION_URL: postgresql://test:test@localhost:5432/ttndd_test
      - run: pnpm test -- --passWithNoTests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/ttndd_test
          DATABASE_MIGRATION_URL: postgresql://test:test@localhost:5432/ttndd_test

  migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ttndd_migrate_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: cd apps/api && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/ttndd_migrate_test
          DATABASE_MIGRATION_URL: postgresql://test:test@localhost:5432/ttndd_migrate_test

  contract-lint:
    name: Contract Lint & Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm --filter @ttndd/constants build && pnpm --filter @ttndd/shared build

      # Validate OpenAPI spec exists and is valid JSON
      - name: Validate OpenAPI spec
        run: |
          if [ ! -f contracts/openapi/ttndd-ops-api.json ]; then
            echo "❌ OpenAPI spec missing! Run: pnpm --filter api generate:openapi"
            exit 1
          fi
          node -e "JSON.parse(require('fs').readFileSync('contracts/openapi/ttndd-ops-api.json','utf8')); console.log('✅ OpenAPI JSON valid')"

      # Validate event catalog exists and has events
      - name: Validate event catalog
        run: |
          if [ ! -f contracts/events/catalog.json ]; then
            echo "❌ Event catalog missing!"
            exit 1
          fi
          node -e "
            const cat = JSON.parse(require('fs').readFileSync('contracts/events/catalog.json','utf8'));
            const modules = Object.keys(cat.events || {});
            if (modules.length === 0) { console.error('❌ Event catalog is empty'); process.exit(1); }
            console.log('✅ Event catalog valid:', modules.length, 'modules');
          "

      # Validate TypeScript types are in sync
      - name: Validate api-types.d.ts exists
        run: |
          if [ ! -f contracts/openapi/api-types.d.ts ]; then
            echo "⚠️  api-types.d.ts missing. Run: node contracts/openapi/codegen.js"
            exit 1
          fi
          echo "✅ TypeScript types present"

      # Verify API compiles successfully (drift check requires full app bootstrap
      # with Firebase/Redis/PubSub — deferred to local dev workflow)
      - name: Verify API build compiles
        run: |
          cd apps/api && npx prisma generate
          cd ../..
          pnpm --filter api build
          echo "✅ API build compiled successfully"
          echo "ℹ️  Full OpenAPI drift check skipped in CI (requires external services)."
          echo "    Run locally: pnpm --filter api generate:openapi"
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          DATABASE_MIGRATION_URL: postgresql://dummy:dummy@localhost:5432/dummy

      # STORY-009 contract artifact validations
      - name: Validate state machine registry
        run: |
          if [ ! -f contracts/state-machines/registry.yaml ]; then
            echo "❌ State machine registry missing!"
            exit 1
          fi
          node -e "
            const yaml = require('fs').readFileSync('contracts/state-machines/registry.yaml','utf8');
            if (!yaml.includes('SM-001') || !yaml.includes('SM-009')) {
              console.error('❌ Registry missing expected state machines');
              process.exit(1);
            }
            console.log('✅ State machine registry valid');
          "

      - name: Validate DB schema contract (Appendix A)
        run: |
          if [ ! -f contracts/db/appendix-a.yaml ]; then
            echo "❌ Appendix A (DB schema contract) missing!"
            exit 1
          fi
          node -e "
            const content = require('fs').readFileSync('contracts/db/appendix-a.yaml','utf8');
            const modelCount = (content.match(/model_name:/g) || []).length;
            if (modelCount < 70) {
              console.error('❌ Appendix A has only', modelCount, 'models (expected ≥70)');
              process.exit(1);
            }
            console.log('✅ Appendix A valid:', modelCount, 'models');
          "

      - name: Validate module contract packs
        run: |
          if [ ! -f contracts/modules/module-contract-packs.yaml ]; then
            echo "❌ Module contract packs missing!"
            exit 1
          fi
          node -e "
            const content = require('fs').readFileSync('contracts/modules/module-contract-packs.yaml','utf8');
            const modules = (content.match(/module_id:/g) || []).length;
            if (modules < 10) {
              console.error('❌ Only', modules, 'modules found (expected ≥10)');
              process.exit(1);
            }
            console.log('✅ Module contract packs valid:', modules, 'modules');
          "

      - name: Validate release artifacts
        run: |
          missing=""
          for f in contracts/release/checklist-matrix.yaml \
                   contracts/release/evidence-bundle.md \
                   contracts/release/module-readiness.yaml \
                   contracts/release/module-capabilities.yaml; do
            if [ ! -f "$f" ]; then
              missing="$missing $f"
            fi
          done
          if [ -n "$missing" ]; then
            echo "❌ Missing release artifacts:$missing"
            exit 1
          fi
          echo "✅ All release artifacts present"

      - name: Validate AI-agent handoff pack
        run: |
          for f in contracts/modules/ai-agent-handoff.md \
                   contracts/modules/scout-contract-pack.md; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing: $f"
              exit 1
            fi
          done
          echo "✅ AI-agent handoff artifacts present"

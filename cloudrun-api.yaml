apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ttndd-api
  labels:
    app: ttndd-ops
    component: api
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '10'
        run.googleapis.com/cpu-throttling: 'true'
        run.googleapis.com/startup-cpu-boost: 'true'
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: ttndd-api-sa@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: gcr.io/PROJECT_ID/ttndd-api:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 512Mi
              cpu: '1'
          startupProbe:
            httpGet:
              path: /api/v1/system/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /api/v1/system/health
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '8080'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ttndd-database-url
                  key: latest
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ttndd-jwt-secret
                  key: latest
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ttndd-redis-url
                  key: latest
            - name: GCS_BUCKET
              value: ttndd-ops-files
            - name: CORS_ORIGINS
              value: https://ttndd-ops.web.app,https://ttndd-ops.firebaseapp.com

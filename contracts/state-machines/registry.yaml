  ticket_lifecycle:
    id: SM-009
    module: Tickets (Module 3)
    db_model: Ticket
    db_status_field: status
    status_enum_values: [OPEN, ASSIGNED, IN_PROGRESS, RESOLVED, CLOSED]
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: ASSIGNED
        action: assign
        guard: assignee_has_permission
        actor: [ADMIN, SYSTEM]
        event: ticket.ticket_assigned
      - from: ASSIGNED
        to: IN_PROGRESS
        action: start_work
        guard: none
        actor: [ASSIGNEE]
        event: null
      - from: [ASSIGNED, IN_PROGRESS]
        to: RESOLVED
        action: resolve
        guard: has_resolution_note
        actor: [ASSIGNEE]
        event: ticket.ticket_resolved
      - from: RESOLVED
        to: CLOSED
        action: close
        guard: requester_confirmed_or_auto_close_7d
        actor: [REQUESTER, SYSTEM]
        event: ticket.ticket_closed
      - from: RESOLVED
        to: IN_PROGRESS
        action: reopen
        guard: within_reopen_window
        actor: [REQUESTER]
        event: null
    failure_states:
      - state: OPEN (stale)
        recovery: auto-assign after SLA threshold
    audit_events: true
    test_harness: apps/api/src/modules/tickets/tickets.service.spec.ts


state_machines:

  member_lifecycle:
    id: SM-001
    module: HRM (Module 1)
    db_model: OrgMember
    db_status_field: status
    status_enum_values: [PENDING, ACTIVE, SUSPENDED, REINSTATED, TRANSFERRED, LEFT]
    initial_state: PENDING
    terminal_states: [LEFT]
    transitions:
      - from: PENDING
        to: ACTIVE
        action: activate
        guard: has_guardian_if_minor
        actor: [ADMIN, LEADER]
        event: hrm.member_activated
      - from: ACTIVE
        to: SUSPENDED
        action: suspend
        guard: requires_reason
        actor: [ADMIN]
        event: hrm.member_suspended
      - from: SUSPENDED
        to: ACTIVE
        action: reinstate
        guard: suspension_review_complete
        actor: [ADMIN]
        event: hrm.member_reinstated
      - from: ACTIVE
        to: TRANSFERRED
        action: transfer
        guard: target_unit_exists
        actor: [ADMIN, LEADER]
        event: hrm.member_transferred
      - from: TRANSFERRED
        to: ACTIVE
        action: complete_transfer
        guard: none
        actor: [SYSTEM]
        event: hrm.member_activated
      - from: [ACTIVE, SUSPENDED]
        to: LEFT
        action: depart
        guard: exit_interview_optional
        actor: [ADMIN, MEMBER]
        event: hrm.member_left
    failure_states:
      - state: SUSPENDED
        recovery: reinstate (requires admin approval)
    audit_events: true
    test_harness: apps/api/src/modules/hrm/hrm.service.spec.ts

  session_lifecycle:
    id: SM-002
    module: Sessions (Module 11)
    db_model: Session
    db_status_field: status
    status_enum_values: [DRAFT, PUBLISHED, IN_PROGRESS, COMPLETED, CANCELLED]
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        action: publish
        guard: has_date_and_leader
        actor: [LEADER]
        event: session.session_published
      - from: PUBLISHED
        to: IN_PROGRESS
        action: start
        guard: within_scheduled_window
        actor: [LEADER]
        event: session.session_started
      - from: IN_PROGRESS
        to: COMPLETED
        action: complete
        guard: attendance_recorded
        actor: [LEADER]
        event: session.session_debriefed
      - from: [DRAFT, PUBLISHED]
        to: CANCELLED
        action: cancel
        guard: none
        actor: [LEADER, ADMIN]
        event: null
    failure_states:
      - state: CANCELLED
        recovery: create new session
    audit_events: true
    test_harness: apps/api/src/modules/sessions/sessions.service.spec.ts

  event_lifecycle:
    id: SM-003
    module: Events & Camps (Module 12)
    db_model: Event
    db_status_field: status
    status_enum_values: [DRAFT, PUBLISHED, REGISTRATION_OPEN, IN_PROGRESS, COMPLETED, CANCELLED]
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        action: publish
        guard: has_venue_and_dates
        actor: [ADMIN, LEADER]
        event: event.event_published
      - from: PUBLISHED
        to: REGISTRATION_OPEN
        action: open_registration
        guard: registration_deadline_set
        actor: [ADMIN]
        event: event.registration_opened
      - from: REGISTRATION_OPEN
        to: IN_PROGRESS
        action: start
        guard: min_participants_met
        actor: [ADMIN, LEADER]
        event: null
      - from: IN_PROGRESS
        to: COMPLETED
        action: complete
        guard: none
        actor: [ADMIN, LEADER]
        event: event.event_completed
      - from: [DRAFT, PUBLISHED, REGISTRATION_OPEN]
        to: CANCELLED
        action: cancel
        guard: notify_registered_participants
        actor: [ADMIN]
        event: null
    failure_states:
      - state: CANCELLED
        recovery: create new event
    audit_events: true
    test_harness: apps/api/src/modules/events/events.service.spec.ts

  skill_progress:
    id: SM-004
    module: Scout Core (Module 8A)
    db_model: MemberSkillProgress
    db_status_field: status
    status_enum_values: [NOT_STARTED, IN_PROGRESS, EVIDENCE_SUBMITTED, VERIFIED, AWARDED]
    initial_state: NOT_STARTED
    terminal_states: [AWARDED]
    transitions:
      - from: NOT_STARTED
        to: IN_PROGRESS
        action: start
        guard: skill_prerequisites_met
        actor: [MEMBER]
        event: scout.skill_started
      - from: IN_PROGRESS
        to: EVIDENCE_SUBMITTED
        action: submit_evidence
        guard: has_file_attachment
        actor: [MEMBER]
        event: scout.evidence_submitted
      - from: EVIDENCE_SUBMITTED
        to: VERIFIED
        action: verify
        guard: assessor_is_qualified
        actor: [LEADER, ASSESSOR]
        event: scout.skill_verified
      - from: EVIDENCE_SUBMITTED
        to: IN_PROGRESS
        action: reject
        guard: requires_feedback
        actor: [LEADER, ASSESSOR]
        event: null
      - from: VERIFIED
        to: AWARDED
        action: award
        guard: none
        actor: [SYSTEM]
        event: scout.skill_awarded
    failure_states:
      - state: IN_PROGRESS (after rejection)
        recovery: re-submit evidence
    audit_events: true
    test_harness: apps/api/src/modules/scout/scout.service.spec.ts


state_machines:
  - SM-SOP-DOC: draft → published → superseded | archived
  - SM-SOP-VER: draft → review → approved → published (rejected → draft)
  - SM-WORKFLOW-RUN: in_progress → completed | cancelled
  - SM-NODE-EXEC: completed | rejected | error | waiting

decisions:
  - DEC-032: Graph executor is synchronous node-by-node (no parallel branches in V1)
  - DEC-033: SOP uses dual state machines — document-level and version-level independently
  - DEC-034: Workflow triggers are pull-based (scan definitions on event, not push subscriptions)

# T-1019: HRM Module Readiness Manifest
# STORY-010 — MODULE 1 HRM IMPLEMENTATION ASSURANCE

module:
  name: HRM (Human Resource Management)
  version: '1.0.0'
  owner: backend-specialist
  story: STORY-010

status: READY_FOR_REVIEW
last_updated: '2026-04-25'

# ─── Backend Services ─────────────────────────────────────────────────

backend:
  controllers:
    - name: HrmController
      file: apps/api/src/modules/hrm/hrm.controller.ts
      endpoints: 14
      status: IMPLEMENTED
      validation: class-validator DTOs
    - name: GuardianController
      file: apps/api/src/modules/hrm/guardian.controller.ts
      endpoints: 4
      status: IMPLEMENTED

  services:
    - name: HrmService
      file: apps/api/src/modules/hrm/hrm.service.ts
      methods: 15
      status: IMPLEMENTED
    - name: GuardianService
      file: apps/api/src/modules/hrm/guardian.service.ts
      status: IMPLEMENTED
    - name: MemberLifecycleService
      file: apps/api/src/modules/hrm/member-lifecycle.service.ts
      state_machine: SM-1
      guards: [approve, offboarding, reinstate]
      status: IMPLEMENTED
    - name: MemberValidationService
      file: apps/api/src/modules/hrm/member-validation.service.ts
      rules: [age-branch, guardian-requirement, compliance-check]
      status: IMPLEMENTED

  dtos:
    file: apps/api/src/modules/hrm/hrm.dto.ts
    classes:
      - CreateMemberDto
      - CreateMemberProfileDto
      - UpdateMemberProfileDto
      - TransitionStatusDto
      - TransferMemberDto
      - AssignUnitDto
      - SignTransferDto
      - MemberFilterDto
    status: IMPLEMENTED

# ─── API Endpoints ─────────────────────────────────────────────────────

api_endpoints:
  - { method: POST, path: '/hrm/members', auth: admin, dto: CreateMemberDto }
  - { method: GET, path: '/hrm/members', auth: any, dto: MemberFilterDto }
  - { method: GET, path: '/hrm/members/:id', auth: any }
  - { method: PUT, path: '/hrm/members/:id', auth: admin, dto: UpdateMemberProfileDto }
  - { method: POST, path: '/hrm/members/:id/transition', auth: admin, dto: TransitionStatusDto }
  - { method: POST, path: '/hrm/members/:id/transfer', auth: super_admin, dto: TransferMemberDto }
  - { method: POST, path: '/hrm/members/:id/assign-unit', auth: admin, dto: AssignUnitDto }
  - { method: GET, path: '/hrm/org-chart', auth: any }
  - { method: GET, path: '/hrm/org-chart/tree', auth: any }
  - { method: GET, path: '/hrm/members/:id/timeline', auth: any }
  - { method: POST, path: '/hrm/transfers/:id/sign', auth: admin, dto: SignTransferDto }
  - { method: GET, path: '/hrm/stats', auth: admin }
  - { method: GET, path: '/hrm/members/:id/character-sheet', auth: any }
  - { method: GET, path: '/hrm/members/:id/compliance', auth: admin }
  - { method: GET, path: '/hrm/compliance/dashboard', auth: admin }

# ─── Frontend Pages ────────────────────────────────────────────────────

frontend:
  pages:
    - {
        path: '/members',
        file: 'apps/web/src/app/(dashboard)/members/page.tsx',
        status: IMPLEMENTED,
        live_data: true,
      }
    - {
        path: '/members/:id',
        file: 'apps/web/src/app/(dashboard)/members/[id]/page.tsx',
        status: IMPLEMENTED,
        live_data: true,
      }
    - {
        path: '/parent-portal',
        file: 'apps/web/src/app/(dashboard)/parent-portal/page.tsx',
        status: IMPLEMENTED,
        live_data: true,
      }
    - {
        path: '/members/compliance',
        file: 'apps/web/src/app/(dashboard)/members/compliance/page.tsx',
        status: IMPLEMENTED,
        live_data: true,
      }
  ui_states:
    loading: IMPLEMENTED
    error: IMPLEMENTED
    empty: IMPLEMENTED

# ─── Data & Schema ─────────────────────────────────────────────────────

schema:
  models: [OrgMember, MemberProfile, GuardianLink, MemberBranchHistory, OrgChartNode, Unit]
  migrations_pending: true # handoverSignedBy/At/Note fields added
  seed_file: apps/api/prisma/seed-hrm.ts
  seed_data: '20 members, 5 guardians, 5 org chart nodes'

# ─── Testing ───────────────────────────────────────────────────────────

testing:
  unit_tests:
    - apps/api/src/modules/hrm/guardian.service.spec.ts
    - apps/api/src/modules/hrm/member-validation.service.spec.ts
  e2e_tests:
    - tests/e2e/hrm/onboard-member.spec.ts
  e2e_coverage:
    - roster page load
    - roster search filter
    - member detail page
    - parent portal page
    - compliance center page
    - API smoke (5 endpoints)

# ─── Compliance ────────────────────────────────────────────────────────

compliance:
  pii_fields: [fullName, address, phone, email, guardianName, guardianPhone, birthDate]
  pii_protection: 'orgId RLS, audit logging, no PII in event payloads'
  coppa_child_data: 'Access logging via audit trail, guardian consent tracking'
  guardian_rules: 'Under-18 requires guardian, blocks removal of last guardian'
  background_check: 'Expiry date tracking with compliance violations'


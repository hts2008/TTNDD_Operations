state_machines:
  - SM-BATTLE: lobby → active → finished
  - SM-ATTEMPT: in_progress → submitted → graded (or expired)
  - SM-COURSE-PROGRESS: (none) → in_progress → completed
  - SM-LESSON-PROGRESS: (none) → completed

decisions:
  - DEC-035: Battle anti-cheat uses 2-second minimum interval + duplicate answer guard + speed-bonus scoring
  - DEC-036: Completion rules are evaluated dynamically (no cached completion state) — supports all_lessons and min_score
  - DEC-037: Offline packs strip correct answers from quiz options to prevent client-side cheating

privacy_rules:
  - "Spiritual logs: member-only access (ForbiddenException for other users)"
  - "Ngũ Giới: hidden from leaders (ForbiddenException with explicit message)"
  - "Evaluations: admin-only create and view"
  - "Mentoring: admin creates, participants view own relationships"

decisions:
  - DEC-043: Spiritual data is member-only — enforced at service layer with ForbiddenException
  - DEC-044: Ngũ Giới is hidden from leaders — even admin cannot view member self-assessments

steps:
  # Step 1: Install dependencies
  - name: 'node:20-slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        corepack enable && corepack prepare pnpm@8 --activate
        pnpm install --frozen-lockfile
    id: install

  # Step 2: Prisma generate
  - name: 'node:20-slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        npx prisma generate --schema=apps/api/prisma/schema.prisma
    id: prisma
    waitFor: ['install']

  # Step 3: Type check (release gate)
  - name: 'node:20-slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        cd apps/api && npx tsc --noEmit
    id: typecheck
    waitFor: ['prisma']

  # Step 4: Lint (release gate)
  - name: 'node:20-slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        npx eslint apps/api/src --ext .ts --max-warnings 0
    id: lint
    waitFor: ['prisma']

  # Step 5: Unit tests
  - name: 'node:20-slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        cd apps/api && npx jest --passWithNoTests --ci
    id: test
    waitFor: ['prisma']

  # Step 6: Build production bundle
  - name: 'node:20-slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        pnpm build --filter=api
    id: build
    waitFor: ['typecheck', 'lint', 'test']

  # Step 7: Docker build
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ttndd-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ttndd-api:latest'
      - '-f'
      - 'Dockerfile'
      - '.'
    id: docker
    waitFor: ['build']

  # Step 8: Push to GCR
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/ttndd-api:$COMMIT_SHA'
    id: push
    waitFor: ['docker']

  # Step 9: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ttndd-api'
      - '--image=gcr.io/$PROJECT_ID/ttndd-api:$COMMIT_SHA'
      - '--region=asia-southeast1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-secrets=DATABASE_URL=ttndd-database-url:latest,JWT_SECRET=ttndd-jwt-secret:latest,REDIS_URL=ttndd-redis-url:latest'
    id: deploy
    waitFor: ['push']

  # Step 10: Post-deploy health check
  - name: 'gcr.io/cloud-builders/curl'
    entrypoint: bash
    args:
      - '-c'
      - |
        sleep 10
        HEALTH_URL=$(gcloud run services describe ttndd-api --region=asia-southeast1 --format="value(status.url)")/api/v1/system/health
        curl -f -s $HEALTH_URL || exit 1
        echo "Health check passed"
    id: healthcheck
    waitFor: ['deploy']

images:
  - 'gcr.io/$PROJECT_ID/ttndd-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/ttndd-api:latest'

timeout: '900s'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

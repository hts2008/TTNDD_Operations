steps:
  # Step 1: Install dependencies
  - name: 'node:20-slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        apt-get update && apt-get install -y openssl && rm -rf /var/lib/apt/lists/*
        corepack enable && corepack prepare pnpm@10.27.0 --activate
        pnpm install --frozen-lockfile
    id: install

  # Step 2: Prisma generate
  - name: 'node:20-slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        apt-get update && apt-get install -y openssl && rm -rf /var/lib/apt/lists/*
        node node_modules/prisma/build/index.js generate --schema=apps/api/prisma/schema.prisma
    id: prisma
    waitFor: ['install']

  # Step 3: Build workspace packages used by API
  - name: 'node:20-slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        corepack enable && corepack prepare pnpm@10.27.0 --activate
        pnpm --filter @ttndd/constants build
    id: build-constants
    waitFor: ['install']

  # Step 4: Type check (release gate)
  - name: 'node:20-slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        node node_modules/typescript/bin/tsc -p apps/api/tsconfig.json --noEmit --incremental false
    id: typecheck
    waitFor: ['prisma', 'build-constants']

  # Step 5: Lint (advisory)
  - name: 'node:20-slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        # Historical lint warnings are tracked separately; typecheck/tests remain blocking.
        ./node_modules/.bin/eslint "apps/api/src/**/*.ts" "apps/api/test/**/*.ts" || true
    id: lint-advisory
    waitFor: ['prisma', 'build-constants']

  # Step 6: Unit tests
  - name: 'node:20-slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        corepack enable && corepack prepare pnpm@10.27.0 --activate
        pnpm --filter api exec jest --passWithNoTests --ci --runInBand
    id: test
    waitFor: ['prisma', 'build-constants']

  # Step 7: Build production bundle
  - name: 'node:20-slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        corepack enable && corepack prepare pnpm@10.27.0 --activate
        pnpm --filter api build
    id: build
    waitFor: ['typecheck', 'lint-advisory', 'test']

  # Step 8: Docker build
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ttndd-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ttndd-api:latest'
      - '-f'
      - 'Dockerfile'
      - '.'
    id: docker
    waitFor: ['build']

  # Step 9: Push to GCR
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/ttndd-api:$COMMIT_SHA'
    id: push
    waitFor: ['docker']

  # Step 10: Push latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/ttndd-api:latest'
    id: push-latest
    waitFor: ['docker']

  # Step 11: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ttndd-api'
      - '--image=gcr.io/$PROJECT_ID/ttndd-api:$COMMIT_SHA'
      - '--region=asia-southeast1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=2'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--execution-environment=gen2'
      - '--service-account=ttndd-api-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--add-cloudsql-instances=$PROJECT_ID:asia-southeast1:ttndd-db'
      - '--set-secrets=DATABASE_URL=ttndd-database-url:latest,JWT_SECRET=ttndd-jwt-secret:latest'
      - '--set-env-vars=NODE_ENV=production,APP_ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GCS_BUCKET=ttndd-uploads-2026,RATE_LIMIT_MAX_REQUESTS=100,RATE_LIMIT_WINDOW_MS=60000,FINANCE_DOUBLE_ENTRY=true'
    id: deploy
    waitFor: ['push', 'push-latest']

images:
  - 'gcr.io/$PROJECT_ID/ttndd-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/ttndd-api:latest'

timeout: '900s'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
